[package]
name = "fidget-gui"
version = "0.5.0"
edition = "2024"
rust-version = "1.95"
authors = ["Matt Keeter <matt.j.keeter@gmail.com>"]
description = "Platform-independent GUI abstractions for Fidget (vendored at fidget e329a898)"
readme = "README.md"
license = "MPL-2.0"
repository = "https://github.com/mkeeter/fidget"
build = false
publish = false

[lib]
name = "fidget_gui"
path = "src/lib.rs"

[dependencies]
fidget-core = { path = "../fidget-core", version = "=0.5.0" }
nalgebra = { version = "0.35", features = ["std", "serde-serialize"], default-features = false }
serde = { version = "1.0", features = ["derive", "rc"] }
