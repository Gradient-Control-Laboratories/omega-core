[package]
name = "fidget-bytecode"
version = "0.5.0"
edition = "2024"
rust-version = "1.95"
authors = ["Matt Keeter <matt.j.keeter@gmail.com>"]
description = "Bytecode representation for Fidget expression tapes (vendored fork that panics on MeshOracle)"
readme = "README.md"
license = "MPL-2.0"
repository = "https://github.com/mkeeter/fidget"
build = false
publish = false

[lib]
name = "fidget_bytecode"
path = "src/lib.rs"

[dependencies]
fidget-core = { path = "../fidget-core", version = "=0.5.0" }
serde = { version = "1.0", features = ["derive", "rc"] }
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
zerocopy = { version = "0.8", features = ["derive"] }
