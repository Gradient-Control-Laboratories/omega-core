[package]
name = "fidget-jit"
version = "0.5.0"
edition = "2024"
rust-version = "1.95"
authors = ["Matt Keeter <matt.j.keeter@gmail.com>"]
description = "Native JIT compiler for Fidget (vendored fork that panics on MeshOracle)"
readme = "README.md"
license = "MPL-2.0"
repository = "https://github.com/mkeeter/fidget"
build = "build.rs"
publish = false

[lib]
name = "fidget_jit"
path = "src/lib.rs"

[dependencies]
arrayvec = "0.7"
dynasmrt = "5.1"
fidget-core = { path = "../fidget-core", version = "=0.5.0" }
static_assertions = "1"

[target."cfg(not(target_os = \"windows\"))".dependencies]
libc = "0.2"

[target."cfg(target_os = \"windows\")".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Memory"] }
