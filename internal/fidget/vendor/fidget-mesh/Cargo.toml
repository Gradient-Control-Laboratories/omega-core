[package]
name = "fidget-mesh"
version = "0.5.0"
edition = "2024"
rust-version = "1.95"
authors = ["Matt Keeter <matt.j.keeter@gmail.com>"]
description = "Meshing of complex closed-form implicit surfaces (vendored fork with a progress callback)"
readme = "README.md"
license = "MPL-2.0"
repository = "https://github.com/mkeeter/fidget"
build = "build.rs"
publish = false

[lib]
name = "fidget_mesh"
path = "src/lib.rs"

[dependencies]
arrayvec = "0.7"
fidget-core = { path = "../fidget-core", version = "=0.5.0" }
nalgebra = { version = "0.35", features = ["std", "serde-serialize"], default-features = false }
ordered-float = "5"
rayon = "1.10"
static_assertions = "1"
