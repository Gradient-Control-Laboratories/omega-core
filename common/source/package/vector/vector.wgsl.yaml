package: vector
accelerations:
  - name: multiply
    kind: operator
    symbol: "*"
    precedence: Multiplication
    signatures:
      - args: [mat, vec]
        return: vec

  - name: multiplyScalar
    kind: operator
    symbol: "*"
    precedence: Multiplication
    signatures:
      - args: [vec, scalar]
        return: vec
      - args: [scalar, vec]
        return: vec

  - name: multiplyComponents
    kind: operator
    symbol: "*"
    precedence: Multiplication
    signatures:
      - args: [vec, vec]
        return: vec

  - name: addVector
    kind: operator
    symbol: "+"
    precedence: Addition
    signatures:
      - args: [vec, vec]
        return: vec

  - name: addScalar
    kind: operator
    symbol: "+"
    precedence: Addition
    signatures:
      - args: [vec, scalar]
        return: vec
      - args: [scalar, vec]
        return: vec

  - name: subtractVector
    kind: operator
    symbol: "-"
    precedence: Addition
    signatures:
      - args: [vec, vec]
        return: vec

  - name: subtractScalarFrom
    kind: operator
    symbol: "-"
    precedence: Addition
    signatures:
      - args: [vec, scalar]
        return: vec

  - name: subtractFromScalar
    kind: operator
    symbol: "-"
    precedence: Addition
    signatures:
      - args: [scalar, vec]
        return: vec

  - name: divideByScalar
    kind: operator
    symbol: "/"
    precedence: Multiplication
    signatures:
      - args: [vec, scalar]
        return: vec

  - name: divideScalarBy
    kind: operator
    symbol: "/"
    precedence: Multiplication
    signatures:
      - args: [scalar, vec]
        return: vec

  - name: divideComponents
    kind: operator
    symbol: "/"
    precedence: Multiplication
    signatures:
      - args: [vec, vec]
        return: vec

  - name: negate
    kind: operator
    symbol: "-"
    precedence: Unary
    unary: true
    signatures:
      - args: [vec]
        return: vec
